[package]
name = "zafe-core"
version = "0.1.0"
description = "Zafe shielded multisig core: keys, FROST, PCZT, vault protocol"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zafe-proto = { path = "../zafe-proto" }
serde.workspace = true
postcard.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
hex.workspace = true
tokio.workspace = true
reddsa.workspace = true
frost-rerandomized.workspace = true
orchard.workspace = true
pczt.workspace = true
zcash_primitives.workspace = true
zcash_protocol.workspace = true
zcash_keys.workspace = true
zcash_client_backend.workspace = true
zcash_client_sqlite.workspace = true
zcash_spec.workspace = true
pasta_curves.workspace = true
group.workspace = true
ff.workspace = true
blake2b_simd.workspace = true
blake3.workspace = true
rand_core.workspace = true
thiserror.workspace = true
zeroize.workspace = true
zip321.workspace = true
zcash_address.workspace = true
tonic.workspace = true
# Only to recognise TLS failures in transport errors (`net::NetFailure`); no provider.
rustls = { version = "0.23", default-features = false }
async-trait.workspace = true
# SQLCipher for the encrypted wallet database, with OpenSSL built from source (static
# libcrypto) so every target, Android included, needs no system crypto library.
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl", "array"] }
rand.workspace = true
zcash_note_encryption.workspace = true
argon2 = "0.5"
chacha20poly1305.workspace = true
zxcvbn = "3"
bip0039 = "0.12"
base64 = "0.22"
# Tor (see src/tor.rs): arti comes in through zcash_client_backend's `tor` feature. These
# carry the relay's HTTP over it and wrap direct connections so Tor can cut them.
tracing.workspace = true
tower.workspace = true
tokio-util = "0.7"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util.workspace = true
bytes = "1"
serde_json.workspace = true

[dev-dependencies]
zafe-relay = { path = "../zafe-relay" }
axum.workspace = true
tokio.workspace = true
# Non-standard fees let tests model a malicious proposer overpaying the fee.
zcash_primitives = { workspace = true, features = ["non-standard-fees"] }
hex.workspace = true
incrementalmerkletree.workspace = true
shardtree.workspace = true
# Local TLS server with a self-signed certificate (tests/tls.rs).
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tempfile = "3"
futures = "0.3"
# Builds key packages from raw shares (tests/reshare.rs).
frost-core = { workspace = true, features = ["internals"] }
