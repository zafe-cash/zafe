[package]
name = "zafe-relay"
version = "0.1.0"
description = "Zafe blind relay: mailboxes, store-and-forward envelopes, vault log"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zafe-proto = { path = "../zafe-proto" }
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# Create token: hashed, compared in constant time.
blake2b_simd.workspace = true
subtle.workspace = true
# FCM: HTTPS to Google and the service-account OAuth flow (RS256 JWT).
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"

[dev-dependencies]
serde_json.workspace = true
tower.workspace = true
http-body-util.workspace = true
rand.workspace = true
