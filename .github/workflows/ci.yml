name: CI

on:
  push:
    branches: [main]
    # Text only: nothing here can break the build (release notes, docs, the site's own
    # workflow checks infra/site).
    paths-ignore: ['docs/**', '**/*.md', 'infra/site/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'infra/site/**']

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a running check (it checks everything the older one would):
  # nothing here deploys or publishes, so cancelling is always safe.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which parts changed: the Rust job only for Rust, the Flutter job only for the app.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'app/rust/**'
              - 'Cargo.*'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'
            flutter:
              - 'app/**'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust (fmt, clippy, tests)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Full debug info made the test binaries (arti/Tor, Halo 2, SQLCipher in each) big
      # enough to fill the runner's disk mid-link: `ld terminated with signal 7 [Bus
      # error]`. Line tables keep file:line in panics and backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
    # No disk freeing: the runner starts with ~86 GB free and the build peaks at ~12 GB of
    # target/ (2026-10-22; freeing ~30 GB of unused SDKs cost 105 s a run).
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Saved from main only: a cache saved on a pull request's ref serves only that PR and
      # pushes main's out of the 10 GB per-repo limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Regtest (Docker), zcash-sign cross-check and bridge e2e tests are #[ignore]d:
      # they need a local node or external binaries.
      - run: cargo test --workspace
      - name: Disk usage
        if: always()
        run: df -h / && du -sh target 2>/dev/null || true

  zip2005-vectors:
    name: ZIP 2005 vectors (independent Python check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_zip2005_vectors.py

  no-telemetry:
    name: No telemetry dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-no-telemetry.sh

  flutter:
    name: Flutter (analyze, test)
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      # Our code only: rust_builder/cargokit/build_tool is vendored tooling with its own
      # pubspec, which the app's `pub get` doesn't resolve.
      - run: flutter analyze lib test tool
      # Unit tests only; tool/illustrations/preview_test.dart renders art for review.
      - run: flutter test test
