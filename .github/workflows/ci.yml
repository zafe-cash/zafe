name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded pull-request runs are cancelled; every push to main gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Full debug info made the test binaries (arti/Tor, Halo 2, SQLCipher in each) big
      # enough to fill the runner's disk mid-link: `ld terminated with signal 7 [Bus
      # error]`. Line tables keep file:line in panics and backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
    steps:
      # The image ships ~30 GB of SDKs we don't use; the Rust build needs the room.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Regtest (Docker), zcash-sign cross-check and bridge e2e tests are #[ignore]d:
      # they need a local node or external binaries.
      - run: cargo test --workspace
      - name: Disk usage
        if: always()
        run: df -h / && du -sh target 2>/dev/null || true

  zip2005-vectors:
    name: ZIP 2005 vectors (independent Python check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_zip2005_vectors.py

  no-telemetry:
    name: No telemetry dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-no-telemetry.sh

  flutter:
    name: Flutter (analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      # Our code only: rust_builder/cargokit/build_tool is vendored tooling with its own
      # pubspec, which the app's `pub get` doesn't resolve.
      - run: flutter analyze lib test tool
      # Unit tests only; tool/illustrations/preview_test.dart renders art for review.
      - run: flutter test test
