name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'infra/site/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'infra/site/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'app/rust/**'
              - 'Cargo.*'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'
            flutter:
              - 'app/**'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust (fmt, clippy, tests)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Disk usage
        if: always()
        run: df -h / && du -sh target 2>/dev/null || true

  zip2005-vectors:
    name: ZIP 2005 vectors (independent Python check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_zip2005_vectors.py

  no-telemetry:
    name: No telemetry dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-no-telemetry.sh

  docs-sync:
    name: Docs match the app and server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_docs_sync.py

  typography:
    name: Type stays on the scale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_typography.py

  theme-pairs:
    name: Theme colours match in dark and light
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_theme_pairs.py

  flutter:
    name: Flutter (analyze, test)
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib test tool
      - run: flutter test test
