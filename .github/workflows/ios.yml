name: iOS build

# Builds the app for iOS on a macOS runner: an unsigned device build (arm64) and a simulator
# build. No signing secrets are used; this only proves the app, the Rust bridge and the
# CocoaPods plugins compile for iOS. Signed IPAs / TestFlight come later (docs/tracker.md).
#
# Run it by hand (Actions > iOS build > Run workflow) or by touching app/ios, the bridge or
# this file on a pull request.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ios.yml'
      - 'app/ios/**'
      - 'app/rust/**'
      - 'app/rust_builder/**'
      - 'app/pubspec.yaml'
      - 'app/pubspec.lock'
      - 'crates/**'
      - 'Cargo.lock'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ios:
    name: Build for iOS (${{ matrix.name }})
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: device (unsigned)
            rust_target: aarch64-apple-ios
            build_args: --release --no-codesign
          - name: simulator
            rust_target: aarch64-apple-ios-sim
            build_args: --debug --simulator
    steps:
      - uses: actions/checkout@v5

      # workmanager_apple uses BGContinuedProcessingTask, which only exists in the iOS 26 SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # Cargokit builds the Rust library into app/build/rust_lib_zafe/build for each pod build.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> app/build/rust_lib_zafe/build'
          key: ios-${{ matrix.rust_target }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build ios ${{ matrix.build_args }} \
            --dart-define=ZAFE_NETWORK=test \
            --build-name=0.0.0 --build-number=${{ github.run_number }}

      - name: Package the device build
        if: matrix.rust_target == 'aarch64-apple-ios'
        run: |
          mkdir dist
          ditto -c -k --keepParent app/build/ios/iphoneos/Runner.app dist/Zafe-unsigned.app.zip
          ls -lh dist

      - uses: actions/upload-artifact@v4
        if: matrix.rust_target == 'aarch64-apple-ios'
        with:
          name: zafe-ios-unsigned
          path: dist/Zafe-unsigned.app.zip
          retention-days: 7

  # Re-signs the unsigned device build into an IPA you can install on your own iPhone.
  # Needs the secrets of the GitHub environment `ios-signing` (restrict that environment to
  # this branch / main so no other workflow can read them). Without them this job is skipped.
  #   IOS_CERT_P12_BASE64      base64 of an Apple Development (or Distribution) certificate .p12
  #   IOS_CERT_PASSWORD        its password
  #   IOS_PROFILE_BASE64       base64 of a provisioning profile for xyz.zafe.zafe that lists
  #                            your iPhone's UDID (development or ad-hoc)
  sign:
    name: Sign the IPA
    needs: ios
    runs-on: macos-26
    timeout-minutes: 20
    environment: ios-signing
    env:
      CERT_P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -n "$CERT_P12" ] && [ -n "$CERT_PASSWORD" ] && [ -n "$PROFILE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets are not set in the ios-signing environment; skipping."
          fi

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: zafe-ios-unsigned

      - name: Sign and package
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          unzip -q Zafe-unsigned.app.zip
          app=Runner.app

          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass=$(uuidgen)
          echo "$CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 1200 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$kc" | awk 'NR==1 {print $2}')
          [ -n "$identity" ] || { echo "::error::No signing identity in the .p12"; exit 1; }

          echo "$PROFILE" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          appid=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          echo "Profile app id: $appid"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          case "$appid" in *."$bundle") ;; *) echo "::error::Profile $appid does not match bundle id $bundle"; exit 1;; esac
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$app/embedded.mobileprovision"

          # Nested code first, then the app itself.
          find "$app" \( -name '*.framework' -o -name '*.dylib' -o -name '*.appex' \) -prune -print0 |
            xargs -0 -I{} codesign --force --sign "$identity" --keychain "$kc" {}
          codesign --force --sign "$identity" --keychain "$kc" \
            --entitlements "$RUNNER_TEMP/entitlements.plist" "$app"
          codesign --verify --deep --strict "$app"

          mkdir Payload && cp -R "$app" Payload/
          zip -qry Zafe-signed.ipa Payload
          ls -lh Zafe-signed.ipa

      - name: Remove the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision"

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: zafe-ios-signed
          path: Zafe-signed.ipa
          retention-days: 3
