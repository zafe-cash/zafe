name: Android build cache

# Builds the release APK's Rust library on main and saves it as the cache the release
# workflows (release.yml, release-mainnet.yml) restore. A tag run can only read caches saved
# on its own tag or on main, so without this every release compiled the Rust from scratch
# (~13 min of a ~15 min build). Also catches a release build that no longer compiles before
# anyone tags it.
#
# No secrets: unsigned build (the debug key), testnet defines, never published. The cache it
# saves goes into signed releases, so this must stay a main-only workflow (main's code is
# what gets tagged anyway); pull requests can't write main's cache.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'app/rust/**'
      - 'app/rust_builder/**'
      - 'Cargo.*'
      - '.github/workflows/android-build.yml'
  # Weekly: a new stable Rust changes the cache key, and a cache unused for 7 days is evicted.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build
  # A newer push builds everything an older one would; cancelling is safe (nothing ships).
  cancel-in-progress: true

# Must match the release workflows: rust-cache keys include CARGO_* and RUST* variables.
env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Release build (unsigned) + Rust cache
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      # Same workspaces and shared key as the release workflows (they restore, never save).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> app/build/rust_lib_zafe/build'
          shared-key: android-release
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --dart-define=ZAFE_NETWORK=test
