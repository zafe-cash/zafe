name: Site

# Builds infra/site (Astro) and deploys it to Cloudflare Workers: production on pushes to
# main, a preview version for pull requests. The site is built here by build.sh; Cloudflare
# serves dist/ as static assets and runs the Worker only for the waitlist and the testnet
# host's /join (infra/site/wrangler.jsonc). Static requests are free and uncounted.
#
# Needs (Settings > Secrets and variables > Actions), see infra/site/README.md:
#   secret   CLOUDFLARE_API_TOKEN       a Cloudflare API token (README "Deploy")
#   variable CLOUDFLARE_ACCOUNT_ID      the Cloudflare account id
#   variable ZAFE_ANDROID_CERT_SHA256   optional: release signing cert, for assetlinks.json
#   variable ZAFE_IOS_APP_IDS           optional: for apple-app-site-association
# Without the Cloudflare settings the site is still built and checked, just not deployed.

on:
  push:
    branches: [main]
    paths: ['infra/site/**', 'app/lib/src/core/config/docs_links.dart', '.github/workflows/site.yml']
  pull_request:
    paths: ['infra/site/**', 'app/lib/src/core/config/docs_links.dart', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Build and deploy the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/site
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ZAFE_ANDROID_CERT_SHA256: ${{ vars.ZAFE_ANDROID_CERT_SHA256 }}
      ZAFE_IOS_APP_IDS: ${{ vars.ZAFE_IOS_APP_IDS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/site/package-lock.json
      - run: npm ci --no-audit --no-fund

      # "Get Zafe" and "Try the testnet build" point at the newest release of each kind
      # (pre-releases never show under /releases/latest). The release workflows start this
      # workflow after publishing, so the links follow every new APK.
      - name: Latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          newest() { # <jq filter on tagName>
            gh release list --repo "$repo" --limit 100 --json tagName,createdAt \
              --jq "[.[] | select(.tagName | $1)] | sort_by(.createdAt) | last | .tagName // empty"
          }
          mainnet=$(newest 'test("^mainnet-v[0-9]")')
          testnet=$(newest 'test("^v[0-9]")')
          [ -z "$mainnet" ] || echo "ZAFE_DOWNLOAD_URL=https://github.com/$repo/releases/tag/$mainnet" >> "$GITHUB_ENV"
          [ -z "$testnet" ] || echo "ZAFE_TESTNET_URL=https://github.com/$repo/releases/tag/$testnet" >> "$GITHUB_ENV"
          echo "mainnet: ${mainnet:-none}, testnet: ${testnet:-none}"
      - run: ./build.sh
      # The docs say what the app and the server do: labels, settings and screens still
      # exist, and every link the app opens resolves on this build (one main build, one
      # set of docs).
      - name: Docs match the app
        working-directory: .
        run: |
          python3 scripts/check_docs_sync.py
          python3 scripts/check_docs_links.py

      - name: Cloudflare settings
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Not deploying: set the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable (infra/site/README.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Production: the site (zafe.cash, testnet.zafe.cash) and the www redirect. A pull
      # request uploads a preview version (its own URL) without touching production.
      - name: Deploy
        id: deploy
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            npx --no-install wrangler deploy
            npx --no-install wrangler deploy --config www/wrangler.jsonc
            echo "**Production deployment:** https://zafe.cash" >> "$GITHUB_STEP_SUMMARY"
            echo "production=true" >> "$GITHUB_OUTPUT"
          else
            alias="pr-${{ github.event.number || github.run_number }}"
            out=$(npx --no-install wrangler versions upload --preview-alias "$alias" --message "$GITHUB_SHA")
            echo "$out"
            url=$(grep -o "https://$alias-[^ ]*workers.dev" <<< "$out" | head -1)
            echo "**Preview:** ${url:-see the log}" >> "$GITHUB_STEP_SUMMARY"
            echo "production=false" >> "$GITHUB_OUTPUT"
          fi

      # Bing & co. recrawl the sitemap's pages soon after a release; never fails the deploy.
      - name: IndexNow
        if: steps.deploy.outputs.production == 'true'
        run: ./indexnow.sh || echo "::warning::IndexNow submission failed"
