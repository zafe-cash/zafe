name: Relay deploy

# Builds the relay image, pushes it to GHCR with build provenance, and deploys that exact
# digest to the testnet VPS (infra/relay/vps/), which rolls back if /health fails.
# Mainnet never deploys from here: .github/workflows/relay-mainnet.yml promotes a digest
# that has been running on testnet, after a reviewer approves.
#
# Needs a GitHub environment `relay-testnet` (deploys from main only) with:
#   secret   RELAY_SSH_KEY       private key of the VPS `deploy` user (bootstrap.sh)
#   secret   RELAY_KNOWN_HOSTS   `ssh-keyscan -t ed25519 <host>` output, checked out of band
#   variable RELAY_HOST          the VPS address, e.g. 57.129.172.198
#   variable RELAY_DOMAIN        e.g. testnet.relay.zafe.cash (DNS only, pointing at the VPS)
#   secret   RELAY_FCM_SERVICE_ACCOUNT_JSON   optional: Firebase service-account key (JSON)
#                                for pushes; written to the server's secrets.env each deploy

on:
  push:
    branches: [main]
    paths:
      - crates/zafe-relay/**
      - crates/zafe-proto/**
      - Cargo.toml
      - Cargo.lock
      - infra/relay/Dockerfile
      - infra/relay/entrypoint.sh
      - infra/relay/vps/**
      - .github/workflows/relay-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-deploy
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/zafe-cash/zafe-relay

jobs:
  test:
    name: Relay tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p zafe-relay -p zafe-proto

  image:
    name: Build and push the image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/relay/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy-testnet:
    name: Deploy to testnet
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: relay-testnet
      url: https://${{ vars.RELAY_DOMAIN }}/health
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.RELAY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.RELAY_KNOWN_HOSTS }}
        run: |
          install -d -m700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host relay\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking yes\n' \
            "${{ vars.RELAY_HOST }}" > ~/.ssh/config
      - name: Copy compose files
        run: tar -C infra/relay/vps -cz compose.yml caddy backup.sh deploy.sh litestream.yml | ssh relay 'tar -C /opt/zafe-relay -xz'
      - name: Relay secrets
        env:
          FCM: ${{ secrets.RELAY_FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FCM" ]; then
            # One line, single-quoted: Compose then takes it literally (no ${} interpolation).
            json=$(jq -ce . <<<"$FCM")
            case "$json" in *"'"*) echo "::error::the FCM key contains a single quote"; exit 1;; esac
            printf "ZAFE_FCM_SERVICE_ACCOUNT_JSON='%s'\n" "$json" |
              ssh relay 'umask 077 && cat > /opt/zafe-relay/secrets.env'
          else
            ssh relay 'rm -f /opt/zafe-relay/secrets.env'
          fi
      - name: Deploy
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | ssh relay \
            "bash /opt/zafe-relay/deploy.sh testnet '${{ env.IMAGE }}@${{ needs.image.outputs.digest }}' '${{ vars.RELAY_DOMAIN }}'"
      - name: Public health check
        run: |
          # The first deploy waits for Caddy's certificate.
          for _ in $(seq 30); do
            if [ "$(curl -fsS --max-time 10 "https://${{ vars.RELAY_DOMAIN }}/health")" = ok ]; then
              echo "https://${{ vars.RELAY_DOMAIN }} is healthy"; exit 0
            fi
            sleep 10
          done
          echo "https://${{ vars.RELAY_DOMAIN }}/health did not answer ok (DNS? firewall?)" >&2
          exit 1
