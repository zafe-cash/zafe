name: Relay deploy

on:
  push:
    branches: [main]
    paths:
      - crates/zafe-relay/**
      - crates/zafe-proto/**
      - Cargo.toml
      - Cargo.lock
      - infra/relay/Dockerfile
      - infra/relay/entrypoint.sh
      - infra/relay/vps/**
      - .github/workflows/relay-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/zafe-cash/zafe-relay

jobs:
  test:
    name: Relay tests
    concurrency:
      group: relay-test-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p zafe-relay -p zafe-proto

  image:
    name: Build and push the image
    needs: test
    concurrency:
      group: relay-image-${{ github.ref }}
      cancel-in-progress: true
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/relay/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy-testnet:
    name: Deploy to testnet
    needs: image
    concurrency:
      group: relay-deploy
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: relay-testnet
      url: https://${{ vars.RELAY_DOMAIN }}/health
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - name: SSH setup
        env:
          KEY: ${{ secrets.RELAY_TESTNET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.RELAY_KNOWN_HOSTS }}
        run: |
          [ -n "$KEY" ] || { echo "::error::RELAY_TESTNET_SSH_KEY is not set (infra/relay/README.md)"; exit 1; }
          install -d -m700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host relay\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' \
            "${{ vars.RELAY_HOST }}" zafe-testnet > ~/.ssh/config
      - name: Copy compose files
        run: |
          ssh relay "sync ${{ github.sha }}"
      - name: Relay secrets
        env:
          FCM: ${{ secrets.RELAY_FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FCM" ]; then
            json=$(jq -ce . <<<"$FCM")
            case "$json" in *"'"*) echo "::error::the FCM key contains a single quote"; exit 1;; esac
            line=$(printf "ZAFE_FCM_SERVICE_ACCOUNT_JSON='%s'" "$json")
          else
            line=
          fi
          printf '%s' "$line" | ssh relay 'secrets fcm'
      - name: Deploy
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          printf '%s' "$TOKEN" | ssh relay "deploy $DIGEST ${{ vars.RELAY_DOMAIN }}"
      - name: Public health check
        run: |
          for _ in $(seq 30); do
            if [ "$(curl -fsS --max-time 10 "https://${{ vars.RELAY_DOMAIN }}/health")" = ok ]; then
              echo "https://${{ vars.RELAY_DOMAIN }} is healthy"; exit 0
            fi
            sleep 10
          done
          echo "https://${{ vars.RELAY_DOMAIN }}/health did not answer ok (DNS? firewall?)" >&2
          exit 1
