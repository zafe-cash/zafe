app = "zafe-relay-testnet"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ZAFE_RELAY_DB = "/data/relay.sqlite"
  RUST_LOG = "zafe_relay=info"
  ZAFE_RELAY_CLIENT_IP_HEADER = "fly-client-ip"

[[mounts]]
  source = "zafe_relay_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 1000
    hard_limit = 1500

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
