x-relay: &relay
  restart: unless-stopped
  user: "10001:10001"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 768m
  pids_limit: 256
  environment:
    RUST_LOG: zafe_relay=info
    ZAFE_RELAY_CLIENT_IP_HEADER: x-forwarded-for
    ZAFE_RELAY_MAX_DB_MB: "1536"
  networks: [relay]

x-backup: &backup
  restart: unless-stopped
  user: "10001:10001"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  entrypoint: ["/bin/sh", "/backup.sh"]
  network_mode: none

x-litestream: &litestream
  image: litestream/litestream:0.3.13@sha256:027eda2a89a86015b9797d2129d4dd447e8953097b4190e1d5a30b73e76d8d58
  user: "10001:10001"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  env_file:
    - path: litestream.env
      required: false
  networks: [mainnet]
  volumes:
    - relay-mainnet-data:/data
    - ./litestream.yml:/etc/litestream.yml:ro

services:
  caddy:
    image: caddy:2.11-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 256
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      RELAY_TESTNET_DOMAIN: ${RELAY_TESTNET_DOMAIN:?set in .env}
      RELAY_MAINNET_DOMAIN: ${RELAY_MAINNET_DOMAIN:-mainnet.invalid}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [relay, mainnet]

  relay-testnet:
    <<: *relay
    image: ${RELAY_TESTNET_IMAGE:?set in .env}
    env_file:
      - path: secrets.env
        required: false
    volumes:
      - relay-testnet-data:/data

  backup-testnet:
    <<: *backup
    image: ${RELAY_TESTNET_IMAGE:?set in .env}
    volumes:
      - relay-testnet-data:/data
      - ./backup.sh:/backup.sh:ro
      - /var/backups/zafe-relay/testnet:/backups

  restore-mainnet:
    <<: *litestream
    profiles: [mainnet]
    restart: "no"
    command: ["restore", "-config", "/etc/litestream.yml", "-if-db-not-exists", "-if-replica-exists", "/data/relay.sqlite"]

  relay-mainnet:
    <<: *relay
    profiles: [mainnet]
    image: ${RELAY_MAINNET_IMAGE:-zafe-relay-mainnet-not-deployed}
    networks: [mainnet]
    env_file:
      - path: secrets-mainnet.env
        required: false
    depends_on:
      restore-mainnet:
        condition: service_completed_successfully
    volumes:
      - relay-mainnet-data:/data

  litestream-mainnet:
    <<: *litestream
    profiles: [mainnet]
    restart: unless-stopped
    command: ["replicate", "-config", "/etc/litestream.yml"]
    depends_on:
      relay-mainnet:
        condition: service_started

  backup-mainnet:
    <<: *backup
    profiles: [mainnet]
    image: ${RELAY_MAINNET_IMAGE:-zafe-relay-mainnet-not-deployed}
    volumes:
      - relay-mainnet-data:/data
      - ./backup.sh:/backup.sh:ro
      - /var/backups/zafe-relay/mainnet:/backups

networks:
  relay: {}
  mainnet: {}

volumes:
  caddy-data: {}
  caddy-config: {}
  relay-testnet-data: {}
  relay-mainnet-data: {}
