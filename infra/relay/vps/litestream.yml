dbs:
  - path: /data/relay.sqlite
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: relay-mainnet
        endpoint: ${LITESTREAM_ENDPOINT}
        region: ${LITESTREAM_REGION}
        force-path-style: true
        snapshot-interval: 6h
        retention: 336h
        sync-interval: 1s
