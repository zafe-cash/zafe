name: zafe
description: "Zafe: a shielded multisig for Zcash."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  app_links: ^7.0.0
  file_picker: ^11.0.3
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.3.1
  flutter_rust_bridge: 2.11.1
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.0.10+1
  go_router: ^17.1.0
  in_app_update: 4.2.5
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pretty_qr_code: ^3.6.0
  rust_lib_zafe:
    path: rust_builder
  share_plus: ^12.0.1
  shared_preferences: ^2.5.3
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/patina/
    - assets/icons/licenses/
    - assets/illustrations/
    - assets/sounds/
    - assets/fonts/licenses/
    - NOTICE
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
