name: zafe
description: "Zafe: a shielded multisig for Zcash."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  app_links: ^7.2.2
  file_picker: ^13.1.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.3.1
  flutter_rust_bridge: 2.11.1
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.0.10+1
  go_router: ^18.1.1
  in_app_update: 5.0.0
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pretty_qr_code: ^3.6.0
  rust_lib_zafe:
    path: rust_builder
  share_plus: ^13.0.0
  shared_preferences: ^2.5.3
  # Pinned: 2.5.x calls its own Kotlin class over JNI (Pigeon JNI) and ships no R8 keep
  # rules, so a minified release build strips it ("NoSuchMethodError ...
  # SharedPreferencesApiRegistrar.getAll", every prefs call fails, the app hangs at start;
  # seen 2026-10-22 on the Flutter 3.47 branch). 2.4.23 is what 0.1.21 ships.
  shared_preferences_android: 2.4.23
  url_launcher: ^6.3.3
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/patina/
    - assets/icons/licenses/
    - assets/illustrations/
    - assets/sounds/
    - assets/illustrations/layers/
    - assets/fonts/licenses/
    - NOTICE
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
