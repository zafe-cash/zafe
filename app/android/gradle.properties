org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 as Flutter 3.47's template sets it up: the old DSL and Flutter applying the Kotlin
# plugin. Built-in Kotlin waits for every plugin to migrate (docs.flutter.dev,
# "Migrating Flutter Android projects to built-in Kotlin"). Optimized resource shrinking
# (Play's memory recommendation) is AGP 9's default.
android.newDsl=false
android.builtInKotlin=false
